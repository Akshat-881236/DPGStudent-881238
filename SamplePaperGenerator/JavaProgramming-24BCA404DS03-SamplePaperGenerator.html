<script>

const LQ_DB = {

"Explain the main features of Java and describe the roles of JVM, bytecode, JDK and Java API.",
"Explain Java program compilation and execution, including the relationship between source code, bytecode and the JVM.",

],

};
  
function shuffle(arr){

return [...arr]
.sort(()=>0.5-Math.random());

}

function uid(){

return crypto.randomUUID();

}

async function generatePapers(){

const count =
Number(
document.getElementById("paperCount").value
);

const container =
document.getElementById("paperContainer");

container.innerHTML = "";

const { jsPDF } = window.jspdf;

const pdf = new jsPDF({
orientation:"p",
unit:"mm",
format:"a4",
compress:true
});

let lastDocId = "";
let lastPaperCode = "";

for(let p=1;p<=count;p++){

const docId = uid();

const paperCode =
"CG-"+Math.floor(
100000+Math.random()*900000
);

lastDocId = docId;
lastPaperCode = paperCode;

let sq = [];

for(let u=1;u<=4;u++){

sq.push(
shuffle(SQ_DB[u])[0]
);

}

const allSQ =
[].concat(
...Object.values(SQ_DB)
);

sq.push(
...shuffle(allSQ).slice(0,3)
);

sq = sq.slice(0,5);

const paper =
document.createElement("div");

paper.className = "paper";

paper.innerHTML = `

<div class="watermark">
SAMPLE PAPER
</div>

<div class="paper-header">

<img
src="https://akshat-881236.github.io/DPGStudent-881238/DPGSTMLOGO.jpg"
class="college-logo"
crossorigin="anonymous">

<h2>
DPG School of Technology & Management
</h2>

<h3>
Sample Question Paper
</h3>

<div class="subject-meta">

<div>
<b>Subject :</b>
${SUBJECT_INFO.name}
</div>

<div>
<b>Subject Code :</b>
${SUBJECT_INFO.code}
</div>

<div>
<b>Course :</b>
${SUBJECT_INFO.course}
</div>

<div>
<b>Academic Year :</b>
${SUBJECT_INFO.academicYear}
</div>

<div>
<b>Doc ID :</b>
${docId}
</div>

<div>
<b>Paper Code :</b>
${paperCode}
</div>

</div>

</div>

<hr>

<div class="section-title">
Section A (5 × 2 = 10)
</div>

${sq.map((q,i)=>`
<div class="question">
${i+1}. ${q}
</div>
`).join("")}

<hr>

<div class="section-title">
Section B (Long Questions)
</div>

${[1,2,3,4].map(unit=>{

const q =
shuffle(LQ_DB[unit])
.slice(0,2);

return `

<div class="unit-title">
Unit ${unit}
</div>

${q.map((x,i)=>`
<div class="question">
${i+1}. ${x}
(10 Marks)
</div>
`).join("")}

${
unit===2
?
`
<hr>
`
:
`<hr>`
}

`;

}).join("")}

<div class="footer">

Generated By
DPG Sample Paper Generator

<br>

Document ID :
${docId}

<br>

Paper Code :
${paperCode}

<br>

${new Date().toLocaleString()}

</div>

`;

container.appendChild(paper);

const images =
paper.querySelectorAll("img");

await Promise.all(

[...images].map(img=>{

if(img.complete)
return Promise.resolve();

return new Promise(resolve=>{

img.onload = resolve;
img.onerror = resolve;

});

})

);


await new Promise(
resolve=>setTimeout(resolve,500)
);

const canvas =
await html2canvas(
paper,
{
scale:3,
useCORS:true,
allowTaint:false,
logging:false,
backgroundColor:"#ffffff",
imageTimeout:0
}
);

const img =
canvas.toDataURL(
"image/jpeg",
0.92
);

if(p>1){
pdf.addPage();
}

pdf.addImage(
img,
"JPEG",
5,
5,
200,
287,
undefined,
"FAST"
);

}

pdf.setProperties({

title:
`${SUBJECT_INFO.name}-${SUBJECT_INFO.code}-SamplePaper`,

subject:
SUBJECT_INFO.name,

author:
"DPG School of Technology & Management",

creator:
"DPG Sample Paper Generator",

keywords:
`${SUBJECT_INFO.code},${SUBJECT_INFO.name},SamplePaper,DPG`,

producer:
"jsPDF"

});

pdf.setFontSize(1);

pdf.text(

JSON.stringify({

subject:
SUBJECT_INFO.name,

subject_code:
SUBJECT_INFO.code,

course:
SUBJECT_INFO.course,

academic_year:
SUBJECT_INFO.academicYear,

doc_id:
lastDocId,

paper_code:
lastPaperCode,

generated:
new Date().toISOString()

}),

1,
1

);

pdf.save(
`${SUBJECT_INFO.name}-${SUBJECT_INFO.code}-SamplePaper.pdf`
);
