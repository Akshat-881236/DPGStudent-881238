<body>

<h1>📘 Physical Education Semester - 3 Sample Paper Generator</h1>

<div class="controls">

<label>Number Of Papers</label>

<input type="number" id="paperCount" min="1" max="5" value="1" title="Enter number of sample papers to generate (1-5)">

<button onclick="generatePapers()">
Generate PDF
</button>

</div>

<div id="paperContainer"></div>

<script>

const SUBJECT_INFO={

name:"History & Principles of Physical Education",
code:"25PED403MI01",
course:"All UG / PG",
academicYear:"2025-2026",
category:"MIC"

};

const SQ_DB = {
1:[
"Define Indus Valley Civilization.",
"What is the Gurukul system?",
"Mention any two physical activities of the Vedic period.",
"What is an Akhara?",
"Name one contribution of YMCA to Physical Education.",
"What was the aim of Physical Education in ancient India?",
"Name one British sport introduced in India.",
"What is the Great Bath?",
"Define Physical Education.",
"Name one post-independence sports institution.",
"What was the focus of PE during Hindu period?",
"Define military training.",
"Name one ancient Indian game.",
"What is national integration?",
"Define culture."
],
2:[
"Define growth.",
"Define development.",
"Mention one factor affecting growth.",
"What is adolescence?",
"Define somatotype.",
"Name any one body type.",
"Define exercise.",
"What is motor development?",
"Mention one benefit of exercise.",
"What is heredity?",
"Define physical fitness.",
"Name one gender difference in PE.",
"Define nutrition.",
"What is bone density?",
"Define muscular strength."
],
3:[
"Define learning.",
"What is motor learning?",
"Define learning curve.",
"What is performance?",
"Who gave Trial and Error theory?",
"Define motivation.",
"What is feedback?",
"Name one law of learning.",
"Define conditioning.",
"What is insight learning?",
"Define affective learning.",
"Define cognitive learning.",
"What is plateau?",
"Define reinforcement.",
"What is practice?"
],
4:[
"Define society.",
"What is leadership?",
"Define social integration.",
"What is gender equality?",
"Name one social value of sports.",
"Define cooperation.",
"What is teamwork?",
"Define national integration.",
"What is women empowerment?",
"Define discipline.",
"Name one leadership quality.",
"What is social harmony?",
"Define culture.",
"What is fair play?",
"Define equality."
]
};

// LONG QUESTIONS (7 each unit)
const LQ_DB = {
1:[
"Explain Physical Education in Indus Valley Civilization.",
"Explain Physical Education during the Vedic period.",
"Explain Physical Education during the Hindu period.",
"Explain the contribution of British period to Physical Education.",
"Explain the Great Bath and its importance.",
"Explain development of Physical Education after 1947.",
"Explain the role of Akharas in Physical Education."
],
2:[
"Explain growth and development in detail.",
"Explain factors affecting growth and development.",
"Explain age and gender differences in Physical Education.",
"Explain somatotypes and their importance.",
"Explain biological benefits of exercise.",
"Explain muscular and skeletal adaptations due to exercise.",
"Explain role of nutrition in growth."
],
3:[
"Explain types of learning in Physical Education.",
"Explain learning curve and its types.",
"Explain relationship between learning and performance.",
"Explain theories of learning.",
"Explain laws and principles of learning.",
"Explain role of motivation in learning.",
"Explain importance of psychology in Physical Education."
],
4:[
"Explain relationship between society and Physical Education.",
"Explain leadership through sports.",
"Explain social integration through physical activities.",
"Explain Physical Education and gender equality.",
"Explain role of PE in social development.",
"Explain role of sports in national integration.",
"Explain women empowerment through sports."
]
};

function shuffle(arr){

return [...arr]
.sort(()=>0.5-Math.random());

}

function uid(){

return crypto.randomUUID();

}

async function generatePapers(){

const count =
Number(
document.getElementById("paperCount").value
);

const container =
document.getElementById("paperContainer");

container.innerHTML = "";

const { jsPDF } = window.jspdf;

const pdf = new jsPDF({
orientation:"p",
unit:"mm",
format:"a4",
compress:true
});

let lastDocId = "";
let lastPaperCode = "";

for(let p=1;p<=count;p++){

const docId = uid();

const paperCode =
"PE-"+Math.floor(
100000+Math.random()*900000
);

lastDocId = docId;
lastPaperCode = paperCode;

let sq = [];

for(let u=1;u<=4;u++){

sq.push(
shuffle(SQ_DB[u])[0]
);

}

const allSQ =
[].concat(
...Object.values(SQ_DB)
);

sq.push(
...shuffle(allSQ).slice(0,3)
);

sq = sq.slice(0,7);

const paper =
document.createElement("div");

paper.className = "paper";

paper.innerHTML = `

<div class="watermark">
SAMPLE PAPER
</div>

<div class="paper-header">

<img
src="https://akshat-881236.github.io/DPGStudent-881238/DPGSTMLOGO.jpg"
class="college-logo"
crossorigin="anonymous">

<h2>
DPG School of Technology & Management
</h2>

<h3>
Sample Question Paper
</h3>

<div class="subject-meta">

<div>
<b>Subject :</b>
${SUBJECT_INFO.name}
</div>

<div>
<b>Subject Code :</b>
${SUBJECT_INFO.code}
</div>

<div>
<b>Course :</b>
${SUBJECT_INFO.course}
</div>

<div>
<b>Academic Year :</b>
${SUBJECT_INFO.academicYear}
</div>

<div>
<b>Doc ID :</b>
${docId}
</div>

<div>
<b>Paper Code :</b>
${paperCode}
</div>

</div>

</div>

<hr>

<div class="section-title">
Section A (7 × 1 = 7)
</div>

${sq.map((q,i)=>`
<div class="question">
${i+1}. ${q}
</div>
`).join("")}

<hr>

<div class="section-title">
Section B (Long Questions)
</div>

${[1,2,3,4].map(unit=>{

const q =
shuffle(LQ_DB[unit])
.slice(0,2);

return `

<div class="unit-title">
Unit ${unit}
</div>

${q.map((x,i)=>`
<div class="question">
${i+1}. ${x}
(7 Marks)
</div>
`).join("")}

${
unit===2
?
`
<hr>
`
:
`<hr>`
}

`;

}).join("")}

<div class="footer">

Generated By
DPG Sample Paper Generator

<br>

Document ID :
${docId}

<br>

Paper Code :
${paperCode}

<br>

${new Date().toLocaleString()}

</div>

`;

container.appendChild(paper);

const images =
paper.querySelectorAll("img");

await Promise.all(

[...images].map(img=>{

if(img.complete)
return Promise.resolve();

return new Promise(resolve=>{

img.onload = resolve;
img.onerror = resolve;

});

})

);


await new Promise(
resolve=>setTimeout(resolve,500)
);

const canvas =
await html2canvas(
paper,
{
scale:3,
useCORS:true,
allowTaint:false,
logging:false,
backgroundColor:"#ffffff",
imageTimeout:0
}
);

const img =
canvas.toDataURL(
"image/jpeg",
0.92
);

if(p>1){
pdf.addPage();
}

pdf.addImage(
img,
"JPEG",
5,
5,
200,
287,
undefined,
"FAST"
);

}

pdf.setProperties({

title:
`${SUBJECT_INFO.name}-${SUBJECT_INFO.code}-SamplePaper`,

subject:
SUBJECT_INFO.name,

author:
"DPG School of Technology & Management",

creator:
"DPG Sample Paper Generator",

keywords:
`${SUBJECT_INFO.code},${SUBJECT_INFO.name},SamplePaper,DPG`,

producer:
"jsPDF"

});

pdf.setFontSize(1);

pdf.text(

JSON.stringify({

subject:
SUBJECT_INFO.name,

subject_code:
SUBJECT_INFO.code,

course:
SUBJECT_INFO.course,

academic_year:
SUBJECT_INFO.academicYear,

doc_id:
lastDocId,

paper_code:
lastPaperCode,

generated:
new Date().toISOString()

}),

1,
1

);

pdf.save(
`${SUBJECT_INFO.name}-${SUBJECT_INFO.code}-SamplePaper.pdf`
);

}

</script>
