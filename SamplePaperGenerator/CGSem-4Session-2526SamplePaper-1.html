function shuffle(arr){

return [...arr]
.sort(()=>0.5-Math.random());

}

function uid(){

return crypto.randomUUID();

}

async function generatePapers(){

const count =
Number(
document.getElementById("paperCount").value
);

const container =
document.getElementById("paperContainer");

container.innerHTML = "";

const { jsPDF } = window.jspdf;

const pdf = new jsPDF({
orientation:"p",
unit:"mm",
format:"a4",
compress:true
});

let lastDocId = "";
let lastPaperCode = "";

for(let p=1;p<=count;p++){

const docId = uid();

const paperCode =
"PE-"+Math.floor(
100000+Math.random()*900000
);

lastDocId = docId;
lastPaperCode = paperCode;

let sq = [];

for(let u=1;u<=4;u++){

sq.push(
shuffle(SQ_DB[u])[0]
);

}

const allSQ =
[].concat(
...Object.values(SQ_DB)
);

sq.push(
...shuffle(allSQ).slice(0,3)
);

sq = sq.slice(0,7);

const paper =
document.createElement("div");

paper.className = "paper";

paper.innerHTML = `

<div class="watermark">
SAMPLE PAPER
</div>

<div class="paper-header">

<img
src="https://akshat-881236.github.io/DPGStudent-881238/DPGSTMLOGO.jpg"

${docId}
</div>

<div>

${paperCode}
</div>

</div>

</div>

<hr>

<div class="section-title">
Section A (7 × 1 = 7)
</div>

${sq.map((q,i)=>`
<div class="question">
${i+1}. ${q}
</div>
`).join("")}

<hr>

<div class="section-title">
Section B (Long Questions)
</div>

${[1,2,3,4].map(unit=>{

const q =
shuffle(LQ_DB[unit])
.slice(0,2);

return `

<div class="unit-title">
Unit ${unit}
</div>

${q.map((x,i)=>`
<div class="question">
${i+1}. ${x}
(7 Marks)

`).join("")}

unit===2
?
`

`
:
`<hr>`
}

}).join("")}

${docId}

${paperCode}

paper.querySelectorAll("img");

await Promise.all(

[...images].map(img=>{

if(img.complete)
return Promise.resolve();

return new Promise(resolve=>{

img.onload = resolve;
